name: GMB estimated position validation

on:
  push:
    branches:
      - feature/gmb-estimated-vehicles
  pull_request:
    branches:
      - main
    paths:
      - "src/lib/gmb-*.ts"
      - "src/lib/gmb-*.json"
      - "src/lib/gmb-feed.ts"
      - "src/app/api/gmb/**"
      - "src/components/city-map.tsx"
      - "src/lib/types.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gmb-estimated-position.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run estimated-position validation
        run: node --experimental-strip-types src/lib/gmb-estimated-position.test.ts
      - name: Run TypeScript checks
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
      - name: Build application
        run: npm run build
